<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <title>落日</title>
    <meta name="theme-color" content="#f3b38a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <style>
      :root { --ink: #4a3b36; --card: rgba(255, 246, 236, 0.86); --accent: #e07a5f; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f6caa6; color: var(--ink);
        font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
        user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
      canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
      #ui { position: fixed; top: calc(12px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right));
        display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
      #ui > div { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--card); }
      #ui button { width: 40px; height: 40px; border: 0; border-radius: 50%; padding: 9px; background: none; color: var(--ink); opacity: 0.55; }
      #ui #tools button { width: 32px; height: 32px; padding: 7px; }
      #ui button[aria-pressed="true"] { background: var(--accent); color: #fff; opacity: 1; }
      #ui i { width: 1px; margin: 8px 2px; background: currentColor; opacity: 0.2; }
      #pad, #ui { transition: opacity 0.8s; }
      .auto #pad { opacity: 0.2; }
      .auto #ui { opacity: 0.45; }
      .idle #ui { opacity: 0.2; }
      #ui:hover { opacity: 1; }
      .pwa #pad { display: none; }
      #ui svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
      #start div { background: var(--card); padding: 14px 28px; border-radius: 24px; text-align: center; font-size: 22px; }
      #start small { display: block; margin-top: 6px; font-size: 14px; opacity: 0.7; white-space: nowrap; }
      #start .tc { display: none; }
      #pad { position: fixed; left: 0; right: 0; bottom: 0; display: none; justify-content: space-between; align-items: flex-end;
        padding: 0 calc(16px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); pointer-events: none; }
      #pad .grp { display: flex; gap: 14px; pointer-events: auto; }
      #pad button { width: 76px; height: 76px; border-radius: 50%; border: 0; font: inherit; font-size: 22px; color: var(--ink);
        background: rgba(255, 246, 236, 0.6); touch-action: none; }
      #pad button.gas { height: 108px; border-radius: 38px; background: rgba(224, 122, 95, 0.55); color: #fff; }
      #pad button.brk { font-size: 17px; }
      #pad button.on { background: rgba(255, 246, 236, 0.95); transform: scale(0.94); }
      #pad button.gas.on { background: rgba(224, 122, 95, 0.95); }
      @media (pointer: coarse) { #pad { display: flex; } #start .kb { display: none; } #start .tc { display: inline; } }
      #rotate { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        background: #4a3b36; color: #fff6ec; font-size: 18px; touch-action: none; }
      #rotate svg { width: 72px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="start"><div>點一下開始<small class="kb">W / ↑ 油門　S / ↓ 煞車・倒車　A D / ← → 轉向・點畫面左右換車道</small><small class="tc">點畫面左／右半邊換車道，其餘自動開</small></div></div>
    <div id="ui">
    <div id="mode">
      <button data-mode="sunset" aria-label="落日模式" title="落日模式"><svg viewBox="0 0 24 24"><path d="M6 17a6 6 0 0 1 12 0M2 17h20M5 21h14M12 5v3M4.2 9.2l2 2M19.8 9.2l-2 2" /></svg></button>
      <button data-mode="real" aria-label="現實模式（依台灣時間）" title="現實模式（依台灣時間）"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></svg></button>
      <i></i>
      <button id="auto" aria-pressed="false" aria-label="自動駕駛" title="自動駕駛（任何按鍵或觸控即交還控制）"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><circle cx="12" cy="12" r="2.5" /><path d="M3.2 10.8 9.6 11.6M20.8 10.8 14.4 11.6M12 14.5V21" /></svg></button>
    </div>
    <div id="tools">
      <button id="snd" aria-pressed="true" aria-label="聲音" title="聲音"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" /></svg></button>
    </div>
    </div>
    <div id="pad">
      <div class="grp"><button data-k="left" aria-label="左轉">◀</button><button data-k="right" aria-label="右轉">▶</button></div>
      <div class="grp"><button data-k="down" class="brk" aria-label="煞車／倒車">煞車</button><button data-k="up" class="gas" aria-label="油門">油門</button></div>
    </div>
    <div id="rotate"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2" /><path d="M2.5 15a9.5 9.5 0 0 0 4.5 6M21.5 9A9.5 9.5 0 0 0 17 3" /></svg>請將裝置轉為橫向</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
