<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <title>落日</title>
    <meta name="theme-color" content="#f3b38a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <style>
      :root { --ink: #4a3b36; --card: rgba(255, 246, 236, 0.86); --accent: #e07a5f; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f6caa6; color: var(--ink);
        font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
        user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
      canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
      [hidden] { display: none !important; }
      .box { background: var(--card); border-radius: 14px; padding: 8px 14px; display: flex; flex-direction: column; min-width: 92px; }
      .box b { font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
      .box small { font-size: 12px; opacity: 0.7; }
      #hud { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: calc(12px + env(safe-area-inset-left));
        right: calc(12px + env(safe-area-inset-right)); display: flex; justify-content: space-between; pointer-events: none; }
      #hud .r { text-align: right; }
      #toast { position: fixed; top: 24%; left: 50%; transform: translateX(-50%); background: var(--card);
        padding: 10px 20px; border-radius: 999px; font-size: 16px; white-space: nowrap; pointer-events: none; }
      #toast .tc { display: none; }
      #pad { position: fixed; left: 0; right: 0; bottom: 0; display: none; justify-content: space-between; align-items: flex-end;
        padding: 0 calc(16px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); pointer-events: none; }
      #pad .grp { display: flex; gap: 14px; pointer-events: auto; }
      #pad button { width: 76px; height: 76px; border-radius: 50%; border: 0; font: inherit; font-size: 22px; color: var(--ink);
        background: rgba(255, 246, 236, 0.6); touch-action: none; }
      #pad button.gas { height: 108px; border-radius: 38px; background: rgba(224, 122, 95, 0.55); color: #fff; }
      #pad button.brk { font-size: 17px; }
      #pad button.on { background: rgba(255, 246, 236, 0.95); transform: scale(0.94); }
      #pad button.gas.on { background: rgba(224, 122, 95, 0.95); }
      @media (pointer: coarse) { #pad { display: flex; } #toast .kb { display: none; } #toast .tc { display: inline; } }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud">
      <div class="box"><b id="spd">0</b><small>km/h</small></div>
      <div class="box r"><b id="odo">0.0</b><small>里程 km</small></div>
    </div>
    <div id="toast"><span class="kb">W / ↑ 油門　S / ↓ 煞車・倒車　A D / ← → 轉向</span><span class="tc">按住油門出發，◀ ▶ 換車道</span></div>
    <div id="pad">
      <div class="grp"><button data-k="left" aria-label="左轉">◀</button><button data-k="right" aria-label="右轉">▶</button></div>
      <div class="grp"><button data-k="down" class="brk" aria-label="煞車／倒車">煞車</button><button data-k="up" class="gas" aria-label="油門">油門</button></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
