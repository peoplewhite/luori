<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <title>落日</title>
    <meta name="theme-color" content="#f3b38a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <style>:root{--ink:#4a3b36;--card:#fff6ecdb;--accent:#e07a5f}*{box-sizing:border-box}html,body{height:100%;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;background:#f6caa6;margin:0;font-family:PingFang TC,Noto Sans TC,Microsoft JhengHei,system-ui,sans-serif;overflow:hidden}canvas{width:100%;height:100%;display:block;position:fixed;inset:0}#mode{top:calc(12px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));background:var(--card);border-radius:999px;gap:4px;padding:4px;display:flex;position:fixed}#mode button{width:40px;height:40px;color:var(--ink);opacity:.55;background:0 0;border:0;border-radius:50%;padding:9px}#mode button[aria-pressed=true]{background:var(--accent);color:#fff;opacity:1}#mode i{opacity:.2;background:currentColor;width:1px;margin:8px 2px}#pad,#mode{transition:opacity .8s}.auto #pad{opacity:.2}.auto #mode{opacity:.45}.auto #mode:hover{opacity:1}.auto #toast,.pwa #toast,.pwa #pad{display:none}#mode svg{fill:none;stroke:currentColor;stroke-width:2px;stroke-linecap:round;width:100%;height:100%;display:block}#toast{background:var(--card);white-space:nowrap;pointer-events:none;border-radius:999px;padding:10px 20px;font-size:16px;animation:1s 5s forwards fade-out;position:fixed;top:24%;left:50%;transform:translate(-50%)}@keyframes fade-out{to{opacity:0;visibility:hidden}}#toast .tc{display:none}#pad{padding:0 calc(16px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));pointer-events:none;justify-content:space-between;align-items:flex-end;display:none;position:fixed;bottom:0;left:0;right:0}#pad .grp{pointer-events:auto;gap:14px;display:flex}#pad button{width:76px;height:76px;font:inherit;color:var(--ink);touch-action:none;background:#fff6ec99;border:0;border-radius:50%;font-size:22px}#pad button.gas{color:#fff;background:#e07a5f8c;border-radius:38px;height:108px}#pad button.brk{font-size:17px}#pad button.on{background:#fff6ecf2;transform:scale(.94)}#pad button.gas.on{background:#e07a5ff2}@media (pointer:coarse){#pad{display:flex}#toast .kb{display:none}#toast .tc{display:inline}}#rotate{color:#fff6ec;touch-action:none;background:#4a3b36;flex-direction:column;justify-content:center;align-items:center;gap:16px;font-size:18px;display:none;position:fixed;inset:0}#rotate svg{fill:none;stroke:currentColor;stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round;width:72px}@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}</style>
    <script type="module" crossorigin src="./assets/index-DYDjGUJx.js"></script>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="mode">
      <button data-mode="sunset" aria-label="落日模式" title="落日模式"><svg viewBox="0 0 24 24"><path d="M6 17a6 6 0 0 1 12 0M2 17h20M5 21h14M12 5v3M4.2 9.2l2 2M19.8 9.2l-2 2" /></svg></button>
      <button data-mode="real" aria-label="現實模式（依台灣時間）" title="現實模式（依台灣時間）"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></svg></button>
      <i></i>
      <button id="auto" aria-pressed="false" aria-label="自動駕駛" title="自動駕駛（任何按鍵或觸控即交還控制）"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><circle cx="12" cy="12" r="2.5" /><path d="M3.2 10.8 9.6 11.6M20.8 10.8 14.4 11.6M12 14.5V21" /></svg></button>
    </div>
    <div id="toast"><span class="kb">W / ↑ 油門　S / ↓ 煞車・倒車　A D / ← → 轉向</span><span class="tc">按住油門出發，◀ ▶ 換車道</span></div>
    <div id="pad">
      <div class="grp"><button data-k="left" aria-label="左轉">◀</button><button data-k="right" aria-label="右轉">▶</button></div>
      <div class="grp"><button data-k="down" class="brk" aria-label="煞車／倒車">煞車</button><button data-k="up" class="gas" aria-label="油門">油門</button></div>
    </div>
    <div id="rotate"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2" /><path d="M2.5 15a9.5 9.5 0 0 0 4.5 6M21.5 9A9.5 9.5 0 0 0 17 3" /></svg>請將裝置轉為橫向</div>
  </body>
</html>
